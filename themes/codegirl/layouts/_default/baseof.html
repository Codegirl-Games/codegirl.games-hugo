<!DOCTYPE html>
<html lang="{{ with .Site.Language.Locale }}{{ . }}{{ else }}en{{ end }}">
<head>
  {{ partial "head.html" . }}
</head>
<body class="page">
  <a class="skip-link" href="#main">Skip to content</a>
  {{ partial "header.html" . }}

    {{ block "main" . }}{{ end }}

  {{ partial "footer.html" . }}
</body>
</html>
