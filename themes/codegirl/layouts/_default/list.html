{{ define "main" }}
<section class="section container">
  <header class="section__header">
    <h1 class="section__title">{{ .Title }}</h1>
    {{ with .Content }}
    <div class="section__intro content">{{ . }}</div>
    {{ end }}
  </header>
  <ul class="post-list">
    {{ range .Pages.ByDate.Reverse }}
    <li class="post-list__item">
      {{ partial "post-card.html" . }}
    </li>
    {{ end }}
  </ul>
</section>
{{ end }}
